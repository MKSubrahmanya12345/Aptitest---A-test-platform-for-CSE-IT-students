# Opt in with --spring.profiles.active=mysql. Legacy tables are never overwritten.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aptitest_java?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:aptitest}
spring.datasource.password=${DB_PASSWORD:}
app.demo-enabled=${APP_DEMO_ENABLED:false}
app.seed-enabled=${APP_SEED_ENABLED:false}
app.mail-mode=${APP_MAIL_MODE:sendgrid}
app.payment-mode=${APP_PAYMENT_MODE:disabled}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
