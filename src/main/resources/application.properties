spring.application.name=AptiTest
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.hiddenmethod.filter.enabled=false
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aptitest_java?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.initial-accounts-enabled=${APP_INITIAL_ACCOUNTS_ENABLED:false}
app.seed-enabled=${APP_SEED_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-mode=${APP_MAIL_MODE:outbox}
app.mail-api-key=${SENDGRID_API_KEY:}
app.mail-from=${APP_MAIL_FROM:noreply@aptitest.example}
app.payment-mode=${APP_PAYMENT_MODE:disabled}
app.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.auto-submit-delay-ms=15000
logging.level.org.hibernate.orm.jdbc.bind=WARN
