spring.application.name=AptiTest
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.hiddenmethod.filter.enabled=false
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/aptitest;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.demo-enabled=${APP_DEMO_ENABLED:true}
app.seed-enabled=${APP_SEED_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail-mode=${APP_MAIL_MODE:demo}
app.mail-api-key=${SENDGRID_API_KEY:}
app.mail-from=${APP_MAIL_FROM:noreply@aptitest.example}
app.payment-mode=${APP_PAYMENT_MODE:demo}
app.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.bootstrap-admin-email=${ADMIN_EMAIL:}
app.bootstrap-admin-password=${ADMIN_PASSWORD:}
app.auto-submit-delay-ms=15000
logging.level.org.hibernate.orm.jdbc.bind=WARN
