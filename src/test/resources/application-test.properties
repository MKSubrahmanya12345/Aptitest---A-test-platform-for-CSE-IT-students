spring.datasource.url=jdbc:h2:mem:aptitest-tests;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
app.initial-accounts-enabled=true
app.seed-enabled=true
app.auto-submit-delay-ms=3600000
logging.level.com.aptitest=WARN
logging.level.org.springframework=WARN
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.mail-mode=outbox
app.payment-mode=disabled
